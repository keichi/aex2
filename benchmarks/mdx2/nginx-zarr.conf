# Serves /mnt/aexram read-only on port 8080, so that zarr-python can read the
# same stores AEX2 serves, over the same link.
#
# Run it standalone rather than as the distribution's service, so the settings
# a measurement depends on are all in this file:
#   sudo nginx -c /home/mdxuser/aex2/benchmarks/mdx2/nginx-zarr.conf
#   sudo nginx -c /home/mdxuser/aex2/benchmarks/mdx2/nginx-zarr.conf -s stop
#
# Everything here exists to keep nginx from being what the measurement finds.

# The workers read the fixtures as the user that owns them, so that the stores
# under the home directory need no loosening to be served.
user mdxuser;
worker_processes 16;
# Without this the 1024 the shell hands nginx caps worker_connections.
worker_rlimit_nofile 65536;
pid /tmp/nginx-zarr.pid;
error_log /tmp/nginx-zarr.error.log warn;

events {
    worker_connections 4096;
}

http {
    access_log off;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # One chunk is one file, and a 4 GiB store has 1026 of them. Four stores
    # plus their shards fit in this.
    open_file_cache max=8192 inactive=300s;
    open_file_cache_valid 300s;
    open_file_cache_min_uses 1;

    # A whole-array read is a thousand-odd GETs on a few connections. The
    # default ceiling would make the client reconnect part way through and
    # the measurement would be of that.
    keepalive_timeout 300s;
    keepalive_requests 1000000;

    server {
        listen 8080 backlog=4096;
        root /mnt/aexram;
        # Ranges are on by default and the sharded stores need them.
        location / {
        }
        # The same stores on the virtio disk, for the cold-read comparison.
        location /disk/ {
            alias /home/mdxuser/disk/;
        }
    }
}
