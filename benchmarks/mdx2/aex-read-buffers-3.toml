# The aex.toml server pinned to three buffers, which was the default until the
# M6 sweep. Kept so the recorded numbers can be re-measured.
[server]
control_addr = "0.0.0.0:50591"
data_addr = "0.0.0.0:50592"
enable_null_backend = true

[server.limits]
max_streams_per_session = 32

[server.paths]
roots = ["/mnt/aexram", "/home/mdxuser/disk"]

[server.transfer]
read_buffers = 3
