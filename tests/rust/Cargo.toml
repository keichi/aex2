[package]
name = "aex-tests"
description = "AEX2 integration tests: server and client in one process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

# No library and no binary: this package exists only to hold the integration
# tests, which are listed explicitly so that they can sit in this directory
# rather than a nested tests/.
autolib = false
autobins = false
autotests = false

[features]
hdf5 = ["dep:hdf5", "aex-server/hdf5"]
sz = ["aex-server/sz", "aex-client/sz"]
zfp = ["aex-server/zfp", "aex-client/zfp"]

[dependencies]
# Writes the fixtures for the HDF5 tests.
hdf5 = { workspace = true, optional = true }

[dev-dependencies]
aex-client.workspace = true
# Compresses the chunks of the Zarr fixtures the way a writer would.
zstd.workspace = true
crc32c.workspace = true
# Checks what a float32 becomes when the server narrows it.
half = "2"
aex-core.workspace = true
aex-proto.workspace = true
aex-server.workspace = true
aex-wire.workspace = true
npyz.workspace = true
tempfile.workspace = true
tonic.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }

[[test]]
name = "control_plane"
path = "control_plane.rs"

[[test]]
name = "data_plane"
path = "data_plane.rs"

[[test]]
name = "parallel"
path = "parallel.rs"

[[test]]
name = "faults"
path = "faults.rs"

[[test]]
name = "hdf5"
path = "hdf5.rs"
required-features = ["hdf5"]

[[test]]
name = "zarr"
path = "zarr.rs"

[[test]]
name = "gather"
path = "gather.rs"

[[test]]
name = "reduce"
path = "reduce.rs"

[[test]]
name = "quality"
path = "quality.rs"
