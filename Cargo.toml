[workspace]
resolver = "2"
members = [
    "crates/aex-core",
    "crates/aex-proto",
    "crates/aex-wire",
    "crates/aex-server",
    "crates/aex-client",
    "benchmarks/rust",
    "tests/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/keichi/aex2"

[workspace.dependencies]
aex-client = { path = "crates/aex-client" }
aex-server = { path = "crates/aex-server" }
aex-core = { path = "crates/aex-core" }
aex-proto = { path = "crates/aex-proto" }
aex-wire = { path = "crates/aex-wire" }

clap = { version = "4", features = ["derive"] }
dashmap = "6"
getrandom = "0.4"
npyz = "0.9"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = "1"
tokio-stream = { version = "0.1", features = ["net"] }
toml = "1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
