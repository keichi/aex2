[workspace]
resolver = "2"
members = [
    "crates/aex-core",
    "crates/aex-proto",
    "crates/aex-wire",
    "crates/aex-server",
    "crates/aex-client",
    "crates/aex-py",
    "benchmarks/rust",
    "tests/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/keichi/aex2"

[workspace.dependencies]
aex-client = { path = "crates/aex-client" }
aex-server = { path = "crates/aex-server" }
aex-core = { path = "crates/aex-core" }
aex-proto = { path = "crates/aex-proto" }
aex-wire = { path = "crates/aex-wire" }

clap = { version = "4", features = ["derive"] }
dashmap = "6"
# zlib-rs: pure Rust and faster than the default miniz_oxide.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
getrandom = "0.4"
# libhdf5 is only asked for metadata; data is read with pread (see backends/hdf5.rs).
hdf5 = { package = "hdf5-metno", version = "0.14", features = ["complex", "f16"] }
hdf5-sys = { package = "hdf5-metno-sys", version = "0.12" }
npyz = "0.9"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
socket2 = { version = "0.6", features = ["all"] }
# Vendors and builds SZ3; needs cmake, a C++17 compiler and libclang.
sz3 = "0.4"
thiserror = "2"
tokio = "1"
tokio-stream = { version = "0.1", features = ["net"] }
toml = "1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Vendors and builds zfp; needs cmake and libclang. `static` also turns OpenMP
# off, so one connection is one compressing core, as it is for SZ3.
zfp-sys = { version = "0.4", features = ["static"] }

proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
