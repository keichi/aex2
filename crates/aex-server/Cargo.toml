[package]
name = "aex-server"
description = "AEX2 server: gRPC control plane and raw-TCP data plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
aex-core.workspace = true
aex-proto.workspace = true
aex-wire.workspace = true
clap.workspace = true
getrandom.workspace = true
serde.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
toml.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Error-bounded lossy compression. See aex-core for the build requirements.
sz = ["aex-core/sz"]
zfp = ["aex-core/zfp"]
hdf5 = ["aex-core/hdf5"]

[dev-dependencies]
tempfile.workspace = true
