[package]
name = "aex-core"
description = "AEX2 core types: dtypes, errors, and array backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# float16 elements, for reductions.
half = "2"
# Keep default-features off: npyz's complex / half features are only needed by
# its data-reading API, not by header parsing.
npyz.workspace = true
# Zarr metadata: one JSON document per node.
serde.workspace = true
serde_json.workspace = true
# Zarr chunk codecs.
crc32c.workspace = true
zstd.workspace = true
thiserror.workspace = true
# The GZIP codec, and the inflate side of the HDF5 deflate filter.
flate2.workspace = true
hdf5 = { workspace = true, optional = true }
hdf5-sys = { workspace = true, optional = true }
sz3 = { workspace = true, optional = true }
zfp-sys = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# posix_fadvise, to start a read before it is wanted.
libc = "0.2"

[features]
# Needs libhdf5 >= 1.14 at build time.
hdf5 = ["dep:hdf5", "dep:hdf5-sys"]
# Error-bounded lossy compression. Builds SZ3 from source: needs cmake, a
# C++17 compiler and libclang.
sz = ["dep:sz3"]
# The other error-bounded codec. Builds zfp from source: needs cmake and
# libclang.
zfp = ["dep:zfp-sys"]

[dev-dependencies]
# Element types the HDF5 tests write.
num-complex = "0.4"
proptest.workspace = true
tempfile.workspace = true
