name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # protoc generates the control plane code; prost-build does not bundle it.
      # libhdf5 is not needed: the extension module does not use the hdf5 feature.
      - name: install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # pdoc imports the package, so the extension module has to be built.
      - name: build and install
        run: pip install -e ".[docs]"
      - name: pdoc
        run: pdoc aex -o _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
