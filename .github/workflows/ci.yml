name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (${{ matrix.os }})
    # Both OSes, to catch regressions in the OS-specific paths (pread, writev).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # protoc generates the control plane code; prost-build does not bundle it.
      - name: install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test (debug)
        run: cargo test --all-features
      # Both profiles: overflow checks make debug and release behave differently.
      - name: test (release)
        run: cargo test --release --all-features

  python:
    name: python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The oldest supported and a current one.
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: build and install
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check python tests/python benchmarks && ruff format --check python tests/python benchmarks
      - name: mypy
        run: mypy
      # The fixtures build and start aex-server themselves.
      - name: pytest
        run: pytest
