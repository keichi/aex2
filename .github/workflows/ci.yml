name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (${{ matrix.os }})
    # Both OSes, to catch regressions in the OS-specific paths (pread, writev).
    strategy:
      fail-fast: false
      matrix:
        # 26.04 because the HDF5 backend needs libhdf5 >= 1.14, and 24.04 ships 1.10.
        os: [ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # protoc generates the control plane code; prost-build does not bundle it.
      # libhdf5 is for the hdf5 feature; cmake, a C++ compiler and libclang are
      # for the sz and zfp features, which build SZ3 and zfp from source.
      # --all-features turns them all on. macOS gets libclang from the Xcode
      # command line tools.
      - name: install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libhdf5-dev cmake libclang-dev
      - name: install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf hdf5 cmake
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # The optional features must stay optional.
      - name: check (default features)
        run: cargo check --all-targets
      # aex-py is left out: it has no tests of its own, and linking its test
      # binary needs a libpython the runner does not ship. The python job below
      # builds and exercises it through maturin.
      - name: test (debug)
        run: cargo test --all-features --workspace --exclude aex-py
      # Both profiles: overflow checks make debug and release behave differently.
      - name: test (release)
        run: cargo test --release --all-features --workspace --exclude aex-py

  python:
    name: python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
        # The oldest supported and a current one.
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install protoc and libhdf5 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libhdf5-dev
      - name: install protoc and libhdf5 (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf hdf5
      - name: build and install
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check python tests/python benchmarks && ruff format --check python tests/python benchmarks
      - name: mypy
        run: mypy
      # The fixtures build and start aex-server themselves.
      - name: pytest
        run: pytest

  wheels:
    name: wheel (${{ matrix.os }})
    # The jobs above only ever pip install -e. Building in the manylinux
    # container is the only way to find out before a release that the wheel is
    # unportable.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      # One abi3 wheel covers every Python from 3.11 on, so no Python matrix.
      - uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          manylinux: auto
          # The container's own protobuf-compiler is 3.5, too old for proto3
          # optional fields.
          before-script-linux: |
            dnf install -y unzip || yum install -y unzip
            curl -sSLo /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
            unzip -q /tmp/protoc.zip -d /usr/local
      # Nothing built in the container is installable on the runner's Python,
      # so import the wheel where it can be installed.
      - name: import the wheel
        if: runner.os == 'macOS'
        run: |
          pip install dist/*.whl
          python -c "import aex; print(aex.__file__)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
