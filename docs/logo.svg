<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2146" height="468" viewBox="0 80 2146 468" role="img" aria-labelledby="title desc">
  <title id="title">AEX2 logo</title>
  <desc id="desc">Selected array elements flow through parallel streams into a gathered result beside the AEX2 wordmark.</desc>
  <!-- Transfer streams, drawn behind the source cells. -->
  <g fill="none" stroke="#0964e8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M113 194 C260 194 350 320 600 320"/>
    <path d="M273 274 C405 274 470 320 600 320"/>
    <path d="M113 354 C280 354 410 320 600 320"/>
    <path d="M273 434 C430 434 500 320 600 320"/>
  </g>
  <path d="M570 308 H650 V275 L732 320 L650 365 V332 H570 Z" fill="#0964e8"/>

  <!-- Sparse source array. -->
  <g>
    <g fill="#102a43">
      <rect x="160" y="160" width="68" height="68" rx="14"/>
      <rect x="240" y="160" width="68" height="68" rx="14"/>
      <rect x="320" y="160" width="68" height="68" rx="14"/>
      <rect x="80" y="240" width="68" height="68" rx="14"/>
      <rect x="160" y="320" width="68" height="68" rx="14"/>
      <rect x="240" y="320" width="68" height="68" rx="14"/>
      <rect x="320" y="320" width="68" height="68" rx="14"/>
      <rect x="80" y="400" width="68" height="68" rx="14"/>
      <rect x="160" y="400" width="68" height="68" rx="14"/>
    </g>
    <g fill="#43aef0">
      <rect x="80" y="160" width="68" height="68" rx="14"/>
      <rect x="240" y="240" width="68" height="68" rx="14"/>
      <rect x="80" y="320" width="68" height="68" rx="14"/>
      <rect x="240" y="400" width="68" height="68" rx="14"/>
    </g>
  </g>

  <!-- Gathered output. -->
  <g fill="#43aef0">
    <rect x="740" y="288" width="64" height="64" rx="13"/>
    <rect x="820" y="288" width="64" height="64" rx="13"/>
    <rect x="900" y="288" width="64" height="64" rx="13"/>
    <rect x="980" y="288" width="64" height="64" rx="13"/>
  </g>

  <!-- AEX2 wordmark. Glyphs are outlined from Futura Medium. -->
  <g transform="translate(1060 450) scale(.20 -.158)">
    <g fill="#102a43">
      <path d="M1092 375H431L259 0H8L772 1641L1509 0H1254L1092 375ZM997 594L768 1119L528 594H997Z"/>
      <path d="M2554 1325H1935V954H2536V735H1935V219H2554V0H1702V1544H2554V1325Z"/>
      <path d="M3183 807L2758 1544H3023L3318 1021L3628 1544H3895L3450 807L3917 0H3656L3314 591L2962 0H2698L3183 807Z"/>
    </g>
    <path d="M4453 219H5028V0H3991L4527 649Q4606 746 4659.5 817Q4713 888 4741 936Q4798 1030 4798 1105Q4798 1213 4722 1286Q4646 1359 4534 1359Q4300 1359 4266 1082H4034Q4090 1570 4527 1570Q4738 1570 4881 1436Q5025 1302 5025 1104Q5025 978 4958 857Q4924 794 4858.5 707.5Q4793 621 4693 503L4453 219Z" fill="#0964e8"/>
  </g>
</svg>
