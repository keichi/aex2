    <path d="M273 274 C405 274 470 320 600 320"/>
    <path d="M113 354 C280 354 410 320 600 320"/>
    <path d="M273 434 C430 434 500 320 600 320"/>
  </g>
  <path d="M570 308 H650 V275 L732 320 L650 365 V332 H570 Z" fill="#0964e8"/>

  <!-- Sparse source array. -->
