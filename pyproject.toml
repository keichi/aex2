[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "aex"
description = "Array Exchange v2 — partial, on-demand transfer of array data over wide-area networks"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = ["numpy>=1.24"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

# NOTE: the extension module (crates/aex-py) and the Python layer (python/aex)
# arrive in M3, so `maturin build` cannot work until then. The settings are
# fixed now so that adding the crate is all that is left to do.
[tool.maturin]
manifest-path = "crates/aex-py/Cargo.toml"
module-name = "aex._aex"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["python/aex"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
