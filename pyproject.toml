[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "aex"
description = "Array Exchange v2 — partial, on-demand transfer of array data over wide-area networks"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = ["numpy>=1.24"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6", "h5py>=3.8"]
docs = ["pdoc>=15"]

[tool.maturin]
manifest-path = "crates/aex-py/Cargo.toml"
module-name = "aex._aex"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["aex"]

[tool.mypy]
strict = true
files = ["python/aex"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
